sonar.projectKey=renatomen_tasknotes
sonar.organization=renatomen

sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is only collected for services/ and utils/ (jest collectCoverageFrom),
# so keep the rest out of the coverage metric. Tighten to mirror jest after the
# first scan shows the real baseline.
sonar.coverage.exclusions=src/**/*.d.ts,src/types/**,src/**/index.ts,src/main.ts
